name: Lint Code

on:
  push:
    branches: [master, main]

  pull_request:
    branches: [master, main]

jobs:

  lint_python:
    runs-on: ubuntu-latest

    steps:

      # Download repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # Install Flake8
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Check Python
      - name: Run Linter
        run: |
          find . -name "*.py" -exec flake8 {} +

  lint_js:
    runs-on: ubuntu-latest

    steps:

      # Download repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Install Node
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Install JSHint
      - name: Install JSHint
        run: npm install jshint --global

      # Check JavaScript
      - name: Run Linter
        run: |
          find ./server/database -name "*.js" -exec jshint {} +
